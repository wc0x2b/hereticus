[package]
name = "hereticus-il"
description = "Decode and lift ARM, Thumb-2, AArch64 and MIPS instructions to a small IL"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.90"

[lib]
bench = false

[dependencies]
compact_str = "0.9"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
rabbitizer = { version = "2.0.0-alpha.9", default-features = false, features = ["std", "MIPS_II"] }
smallvec = "1"
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.4"

[dev-dependencies]
# One test body runs as a plain property test on stable, and under a
# coverage-guided fuzzer when one is available.
bolero = { version = "0.13", features = ["arbitrary"] }
rstest = "0.27"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Maps memory at a fixed address, to put code across a 4 GiB boundary.
libc = "0.2"
