[package]
name = "hereticus-il"
description = "Decode and lift ARM, Thumb-2, AArch64 and MIPS instructions to a small IL"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.90"

[lib]
bench = false

[dependencies]
compact_str = "0.9"
smallvec = "1"

[dev-dependencies]
# One test body runs as a plain property test on stable, and under a
# coverage-guided fuzzer when one is available.
bolero = { version = "0.13", features = ["arbitrary"] }
rstest = "0.27"
