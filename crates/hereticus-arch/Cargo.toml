[package]
name = "hereticus-arch"
description = "The architecture-specific rules that the matching of functions reads"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version = "1.90"

[lib]
bench = false

[dependencies]
hereticus-il = { path = "../hereticus-il", version = "0.1.0" }
hereticus-memory = { path = "../hereticus-memory", version = "0.1.0" }
hereticus-recovery = { path = "../hereticus-recovery", version = "0.1.0" }
compact_str = "0.9"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
rabbitizer = { version = "2.0.0-alpha.9", default-features = false, features = ["std", "MIPS_II"] }
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.4"

[dev-dependencies]
bolero = { version = "0.13", features = ["arbitrary"] }
rstest = "0.27"
