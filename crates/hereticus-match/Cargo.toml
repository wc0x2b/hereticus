[package]
name = "hereticus-match"
description = "Compare and match functions between binaries"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
bench = false

[features]
serde = ["dep:serde", "hereticus-memory/serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
hereticus-arch = { path = "../hereticus-arch", version = "0.6.2" }
hereticus-recovery = { path = "../hereticus-recovery", version = "0.6.2" }
hereticus-callees = { path = "../hereticus-callees", version = "0.6.2" }
hereticus-image = { path = "../hereticus-image", version = "0.6.2" }
hereticus-il = { path = "../hereticus-il", version = "0.6.2" }
hereticus-memory = { path = "../hereticus-memory", version = "0.6.2" }
hereticus-view = { path = "../hereticus-view", version = "0.6.2" }
smallvec = "1"
rayon = "1.12.0"

[dev-dependencies]
bolero = { version = "0.13", features = ["arbitrary"] }
