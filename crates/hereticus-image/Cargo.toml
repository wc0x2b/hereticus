[package]
name = "hereticus-image"
description = "Parse binary files and raw images"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
bench = false

[dependencies]
hereticus-arch = { path = "../hereticus-arch", version = "0.1.0" }
hereticus-il = { path = "../hereticus-il", version = "0.1.0" }
hereticus-memory = { path = "../hereticus-memory", version = "0.1.0" }
hereticus-recovery = { path = "../hereticus-recovery", version = "0.1.0" }
smallvec = "1"
object = "0.40"

[dev-dependencies]
bolero = { version = "0.13", features = ["arbitrary"] }
object = { version = "0.40", features = ["write"] }
