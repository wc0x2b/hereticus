[package]
name = "hereticus-cli"
description = "Command line tool to compare functions between two binaries"
readme = "../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "parsing"]
rust-version.workspace = true
include = ["src/**", "LICENSE-*"]

[[bin]]
name = "hereticus"
path = "src/main.rs"
bench = false
# The library of the same name has the docs; two would overwrite each other.
doc = false

[dependencies]
hereticus = { path = "../hereticus", version = "0.4.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18.6"
console = "0.16"
tabled = { version = "0.22.0", default-features = false, features = ["ansi", "derive", "std"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# The allocator of musl, the default target, serves threads one at a time.
mimalloc = { version = "0.1.52", default-features = false }

[target.'cfg(unix)'.dependencies]
# Ends the tool quietly when a reader closes the pipe, as `head` does.
libc = "0.2"

[dev-dependencies]
insta = "1.48"
insta-cmd = "0.7"
bolero = { version = "0.13", features = ["arbitrary"] }
