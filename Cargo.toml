[workspace]
members = [
    "crates/hereticus-il",
    "crates/hereticus-recovery",
    "crates/hereticus-arch",
    "crates/hereticus-callees",
    "crates/hereticus-image",
    "crates/hereticus-match",
    "crates/hereticus-memory",
    "crates/hereticus-unpack",
    "crates/hereticus-view",
    "hereticus-cli",
    "hereticus",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
authors = ["wc0x2b <wc0x2b@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/wc0x2b/hereticus"
homepage = "https://wc0x2b.github.io/hereticus/"
rust-version = "1.90"
keywords = ["reverse-engineering", "binary-analysis", "bindiff", "firmware", "elf"]
categories = ["development-tools", "parsing"]

[profile.bench]
debug = true
strip = false

[profile.release]
overflow-checks = true

# iced-x86 takes the length of an instruction from the low 32 bits of two
# pointers, which wrap where the bytes lie across a 4 GiB boundary of
# memory. The wrapped length is right, but an overflow check panics, so
# iced-x86 is built without one. See
# `an_instruction_across_a_4_gib_boundary_decodes` of `hereticus-il`.
[profile.release.package.iced-x86]
overflow-checks = false

[profile.dev.package.iced-x86]
overflow-checks = false

# Release(dist) binaries are setup for maximum runtime speed, at the cost of CI time
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
strip = true
overflow-checks = true

[profile.dist.package.iced-x86]
overflow-checks = false
