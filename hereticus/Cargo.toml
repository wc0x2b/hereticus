[package]
name = "hereticus"
description = "Compare functions between two binaries, robust to compiler differences"
readme = "../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
include = ["src/**", "LICENSE-*"]

[lib]
bench = false

[dependencies]
hereticus-il = { path = "../crates/hereticus-il", version = "0.1.1" }
hereticus-recovery = { path = "../crates/hereticus-recovery", version = "0.1.1" }
hereticus-arch = { path = "../crates/hereticus-arch", version = "0.1.1" }
hereticus-callees = { path = "../crates/hereticus-callees", version = "0.1.1" }
hereticus-image = { path = "../crates/hereticus-image", version = "0.1.1" }
hereticus-match = { path = "../crates/hereticus-match", version = "0.1.1" }
hereticus-memory = { path = "../crates/hereticus-memory", version = "0.1.1" }
hereticus-unpack = { path = "../crates/hereticus-unpack", version = "0.1.1" }
hereticus-view = { path = "../crates/hereticus-view", version = "0.1.1" }

[dev-dependencies]
# One test body runs as a plain property test on stable, and under a
# coverage-guided fuzzer when one is available.
bolero = { version = "0.13", features = ["arbitrary"] }
criterion = "0.8.2"
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
# Counts the instructions of a bench under Valgrind, so a CI runner can
# compare two branches with almost no noise.
gungraun = "0.20.0"
insta = "1.48"
# The tests that read whole kernels and the benches run threads that the
# allocator of musl, the default target, serves one at a time.
mimalloc = { version = "0.1.52", default-features = false }
# Writes the small ELF objects the unit tests read.
object = { version = "0.40", features = ["write"] }
rayon = "1.12.0"
rstest = "0.27"
# Reads the pinned Ubuntu cases of `fixtures/ubuntu_cases.json`.
serde_json = "1"

[[bench]]
name = "criterion_benchmark"
harness = false

[[bench]]
name = "gungraun_benchmark"
harness = false
