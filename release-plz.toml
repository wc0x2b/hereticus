# Every crate shares the version of the workspace, so one tag, one GitHub
# release and one changelog, those of `hereticus-cli`, cover them all.
[workspace]
git_tag_enable = false
git_release_enable = false
changelog_update = false
semver_check = true
pr_labels = ["release"]

# The entries of CHANGELOG.md are written by hand under "Unreleased". A
# release adds only its heading above them, and no entry from the commits.
[changelog]
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
"""

[[package]]
name = "hereticus-cli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = false
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
    "hereticus",
    "hereticus-arch",
    "hereticus-callees",
    "hereticus-il",
    "hereticus-image",
    "hereticus-match",
    "hereticus-memory",
    "hereticus-recovery",
    "hereticus-unpack",
    "hereticus-view",
]
