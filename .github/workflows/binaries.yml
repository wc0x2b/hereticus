name: binaries

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Check that the release assets build. The release-plz workflow attaches
  # them to the GitHub release.
  release-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The C part of mimalloc builds for the musl target that
      # `.cargo/config.toml` picks.
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: just

      - name: Build the assets
        run: just release-assets ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: target/release-assets/
